name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_JAVA_VERSION: "21"
  HOST: "mis.bialger.com"
  APP_PORT: "8000"

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with frontend submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Set up JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JAVA_VERSION }}
          cache: gradle

      - name: Set up primary JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Show Java versions
        run: |
          echo "Primary JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Gradle JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build fat jar
        run: ./gradlew clean test shadowJar -Dorg.gradle.java.home="$JAVA_HOME_21_X64"

      - name: Prepare deployment artifact
        run: |
          JAR_PATH="$(ls build/libs/*-all.jar | head -n1)"
          mkdir -p dist
          cp "$JAR_PATH" dist/app.jar
          cp deploy/install-service.sh dist/deploy.sh
          chmod +x dist/deploy.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist/*
          retention-days: 7

  deploy:
    name: Deploy to mis.bialger.com
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mis.bialger.com
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: release

      - name: Set Docker image name
        run: |
          echo "MIS_IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp release/app.jar docker-context/
          docker build -t ${{ env.MIS_IMAGE }} docker-context
          docker push ${{ env.MIS_IMAGE }}

      - name: Upload docker-compose and stop script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ secrets.SERVER_LOGIN }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy/docker-compose.yml,deploy/stop-systemd-service.sh"
          target: "/opt/mis"
          strip_components: 1
          overwrite: true

      - name: Stop old systemd service, then run Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          APP_PORT: ${{ env.APP_PORT }}
          MIS_IMAGE: ${{ env.MIS_IMAGE }}
        with:
          host: ${{ env.HOST }}
          username: ${{ secrets.SERVER_LOGIN }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SERVER_PASSWORD,SERVER_LOGIN,APP_PORT,MIS_IMAGE
          script: |
            set -euo pipefail
            cd /opt/mis

            if [ -f ./stop-systemd-service.sh ]; then
              chmod +x ./stop-systemd-service.sh
              export SUDO_PASSWORD="$SERVER_PASSWORD"
              export SERVICE_NAME="mis"
              export APP_DIR="/opt/mis"
              ./stop-systemd-service.sh || true
            fi

            export APP_PORT="${APP_PORT}"
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d

            echo "Waiting for container to be ready..."
            sleep 5
            docker compose -f docker-compose.yml ps
