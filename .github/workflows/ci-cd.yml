name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_JAVA_VERSION: "21"
  HOST: "mis.bialger.com"
  APP_PORT: "8000"

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mis
          POSTGRES_PASSWORD: mis
          POSTGRES_DB: mis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mis -d mis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MICRONAUT_ENVIRONMENTS: test
      MICRONAUT_DATASOURCES_DEFAULT_URL: jdbc:postgresql://localhost:5432/mis
      MICRONAUT_DATASOURCES_DEFAULT_USERNAME: mis
      MICRONAUT_DATASOURCES_DEFAULT_PASSWORD: mis
      # Must match src/test/resources/application-test.properties and @MicronautTest @Property overrides
      JWT_SECRET: test-jwt-secret-for-integration-tests-only-1234567890
      JWT_COOKIE_SECURE: "false"
      JWT_ACCESS_TOKEN_EXPIRATION: "28800"
      APP_CORS_ALLOWED_ORIGINS: https://mis.bialger.com,http://localhost:3000,http://localhost:5173

    steps:
      - name: Checkout repository (with frontend submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JAVA_VERSION }}
          cache: gradle

      - name: Set up primary JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Show Java versions
        run: |
          echo "Primary JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Gradle JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build fat jar
        run: ./gradlew clean test shadowJar -Dorg.gradle.java.home="$JAVA_HOME_21_X64"

      - name: Print test HTML report on failure
        if: failure()
        run: |
          REPORT_PATH="${GITHUB_WORKSPACE}/build/reports/tests/test/index.html"
          echo "Looking for test report at: ${REPORT_PATH}"
          if [ -f "${REPORT_PATH}" ]; then
            cat "${REPORT_PATH}"
          else
            echo "Test report index.html not found."
            echo "Available files under build/reports:"
            find "${GITHUB_WORKSPACE}/build/reports" -maxdepth 6 -type f || true
          fi

      - name: Print detailed failed test reports on failure
        if: failure()
        run: |
          REPORT_ROOT="${GITHUB_WORKSPACE}/build/reports/tests/test"
          XML_ROOT="${GITHUB_WORKSPACE}/build/test-results/test"

          echo "Looking for failed class reports in: ${REPORT_ROOT}"
          if [ -f "${REPORT_ROOT}/index.html" ]; then
            FAILED_CLASS_LINKS="$(grep -oE 'href=\"classes/[^\"]+\\.html#[^\"]+\"' "${REPORT_ROOT}/index.html" | sed -E 's/href=\"([^\"]+)\"/\1/' | sed -E 's/#.*$//' | sort -u || true)"
            if [ -n "${FAILED_CLASS_LINKS}" ]; then
              while IFS= read -r relpath; do
                [ -z "${relpath}" ] && continue
                fullpath="${REPORT_ROOT}/${relpath}"
                if [ -f "${fullpath}" ]; then
                  echo "----- ${fullpath} -----"
                  cat "${fullpath}"
                fi
              done <<EOF
          ${FAILED_CLASS_LINKS}
          EOF
            else
              echo "No failed class links were found in index.html."
            fi
          else
            echo "Test report index.html not found."
          fi

          echo "Looking for failed XML test results in: ${XML_ROOT}"
          if compgen -G "${XML_ROOT}/TEST-*.xml" > /dev/null; then
            found_failed_xml=0
            for f in "${XML_ROOT}"/TEST-*.xml; do
              if grep -qE 'failures=\"[1-9][0-9]*\"|errors=\"[1-9][0-9]*\"' "${f}"; then
                found_failed_xml=1
                echo "----- ${f} -----"
                cat "${f}"
              fi
            done
            if [ "${found_failed_xml}" -eq 0 ]; then
              echo "No failed XML test files were found."
            fi
          else
            echo "No XML test result files found."
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare deployment artifact
        run: |
          JAR_PATH="$(ls build/libs/*-all.jar | head -n1)"
          mkdir -p dist
          cp "$JAR_PATH" dist/app.jar
          cp deploy/install-service.sh dist/deploy.sh
          chmod +x dist/deploy.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist/*
          retention-days: 7

  deploy:
    name: Deploy to mis.bialger.com
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mis.bialger.com
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: release

      - name: Set Docker image name
        run: |
          echo "MIS_IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp release/app.jar docker-context/
          docker build -t ${{ env.MIS_IMAGE }} docker-context
          docker push ${{ env.MIS_IMAGE }}

      - name: Upload Docker Compose and Caddy config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ secrets.SERVER_LOGIN }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "/opt/mis"
          strip_components: 1
          overwrite: true

      - name: Run Docker Compose on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          APP_PORT: ${{ env.APP_PORT }}
          MIS_IMAGE: ${{ env.MIS_IMAGE }}
          DOMAIN_NAME: ${{ env.HOST }}
          COMPOSE_PROFILES: https
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ env.HOST }}
          username: ${{ secrets.SERVER_LOGIN }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SERVER_PASSWORD,SERVER_LOGIN,APP_PORT,MIS_IMAGE,DOMAIN_NAME,COMPOSE_PROFILES,GHCR_PULL_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            cd /opt/mis

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            export APP_PORT="${APP_PORT}"
            export MIS_IMAGE="${MIS_IMAGE}"
            export DOMAIN_NAME="${DOMAIN_NAME}"
            export COMPOSE_PROFILES="${COMPOSE_PROFILES}"
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d

            echo "Waiting for container to be ready..."
            sleep 5
            docker compose -f docker-compose.yml ps
