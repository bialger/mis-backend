        "200": { description: OK }
    patch:
      tags: [Inventory]
      summary: Update item
      x-required-permission: inventory.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [Inventory]
      summary: Delete item
      x-required-permission: inventory.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
