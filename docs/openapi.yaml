        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }

  /api/system-settings/{id}:
    get:
      tags: [SystemSettings]
      summary: Setting by id
      x-required-permission: settings.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }
    patch:
      tags: [SystemSettings]
      summary: Update setting
      x-required-permission: settings.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [SystemSettings]
      summary: Delete setting
      x-required-permission: settings.write
