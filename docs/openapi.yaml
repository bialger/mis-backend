openapi: 3.1.0
info:
  title: MIS Backend HTTP API
  version: "1.0"
  description: |
    Specification of **actual** Micronaut application paths (prefix `/api/...`, not `/api/v1`).
    Complements the generated Swagger (`/swagger-ui`, build artifacts under `META-INF/swagger`).

    ## Authentication
    - **JWT Bearer**: `Authorization: Bearer <token>` (login response includes a `token` field).
    - **Cookie**: HttpOnly `MIS_AUTH=<token>` (set on successful `/api/auth/login` and `/api/auth/first-password-change`).
    - Anonymous: only `/api/auth/login`, `/api/auth/first-password-change`, and `GET`/`POST` under `/api/public/booking/**` (see `application.properties`).

    ## REST access control (`ApiAccessControlFilter`, `/api/**`)
    After authentication, most routes resolve to **exactly one** permission code (`x-required-permission`).
    If the code is absent (`null`), being logged in is enough. If a code is present, it must be in the employee’s effective permission set (role ± overrides via `/api/access/...`).

    Prefix → code mapping (`GET` vs everything else):
    | Prefix / condition | GET | POST, PUT, PATCH, DELETE |
    |---|---|---|
    | `/api/shell/bootstrap?kind=…` | see `kind` below | — |
    | `/api/access` | `permission.read` | `permission.write` |
    | `/api/organizations` | `organization.read` | `organization.write` |
    | `/api/branches` | `branch.read` | `branch.write` |
    | `/api/employees` | `employee.read` | `employee.write` |
    | `/api/system-settings` | `settings.view` | `settings.write` |
    | `/api/catalog` | `settings.view` (all methods) | — |
    | `/api/rooms` | `schedule.view` (all methods) | — |
    | `/api/audit`… (including `/api/audit-logs`) | `audit.view` | — |
    | `/api/reports` | `reports.view` | — |
    | `/api/inventory`… (`inventory-items`, `inventory-operations`) | `inventory.view` | `inventory.write` |
    | `/api/payments` | `finance.view` | `finance.write` |
    | `/api/time-slots` | `schedule.view` (all methods) | — |
    | `/api/appointments` | `appointments.view` (all methods) | — |
    | `/api/patients`…, `/api/medical-records`…, `/api/attachments`… | `patients.view` (all methods) | — |

    **`/api/shell/bootstrap`** — required query `kind`:
    `dashboard`→`dashboard.view`; `patients`,`patient-detail`→`patients.view`; `doctors`→`doctors.view`;
    `schedule`→`schedule.view`; `inventory`→`inventory.view`; `settings`→`settings.view`;
    `appointments-list`,`appointment-detail`→`appointments.view`; `reports`→`reports.view`; `audit`→`audit.view`;
    otherwise permission enforcement is **not** applied (`null`).

    ## Special cases
    - **`/api/grafana` and `/api/grafana/**`**: even with permissions — only **`SYSADMIN`** role (else 403 with Grafana message).
    - **GraphQL** (`POST /graphql`): the table-based permission filter is **not** applied; authentication only. Schema: `src/main/resources/graphql/schema.graphqls`. GraphiQL: `GET /graphiql` (when enabled).
    - **Permission codes** (canonical): see `components/schemas/PermissionCode` and `AccessPermissionCodes` in code.

    ## Errors
    - `401` — missing, invalid, or expired JWT.
    - `403` — insufficient permission (`error: forbidden`, `message` with code or Grafana).
    - Some endpoints return application-specific error bodies (see controller responses).

    ## Pagination (Micronaut `Pageable`)
    Where query `page` and `size` apply: standard paging; when multiple pages exist, a **Link** header may be present (see `PaginationLinks`).

    ## Other non-REST
    - **MVC JSON** (legacy bootstrap): `GET /mvc/shell/bootstrap` — same query params as `/api/shell/bootstrap`, JSON response (class hidden from Swagger via `@Hidden`).
    - **CRM HTML pages**: `/`, `/login`, `/patients`, … — not OpenAPI; access via HTML filters and legacy permission maps (`HtmlPageAccessFilter`).
servers:
  - url: /
    description: Application root (default port 8000, see `application.properties`)

tags:
  - name: Auth
  - name: PublicBooking
  - name: Shell
  - name: Access
  - name: Catalog
  - name: Organizations
  - name: Branches
  - name: Employees
  - name: Rooms
  - name: SystemSettings
  - name: Appointments
  - name: TimeSlots
  - name: Patients
  - name: PatientConsents
  - name: MedicalRecords
  - name: Attachments
  - name: Payments
  - name: Inventory
  - name: InventoryOperations
  - name: Audit
  - name: Reports
  - name: GraphQL
  - name: Meta

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in (email + password)
      description: Returns JWT in body and `MIS_AUTH` cookie. For SYSADMIN with `mustChangePassword`, only `passwordChangeRequired` is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Invalid credentials }

  /api/auth/first-password-change:
    post:
      tags: [Auth]
      summary: First-login password change (SYSADMIN)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, newPassword]
              properties:
                login: { type: string }
                password: { type: string }
                newPassword: { type: string }
      responses:
        "200": { description: OK, cookie set }
        "401": { description: Authorization error }
        "409": { description: Password change not required }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear authentication cookie
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204": { description: No content }

  /api/public/booking/branches:
    get:
      tags: [PublicBooking]
      summary: Branches available for online booking
      security: []
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/public/booking/doctors:
    get:
      tags: [PublicBooking]
      summary: Doctors for a branch
      security: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "400": { description: Invalid branchId }

  /api/public/booking/slots:
    get:
      tags: [PublicBooking]
      summary: Time slots for one day
      security: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: employeeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: slotDate
          in: query
          required: true
          schema: { type: string, description: ISO date }
      responses:
        "200": { description: OK }
        "400": { description: Invalid parameters }

  /api/public/booking/appointments:
    post:
      tags: [PublicBooking]
      summary: Create patient and appointment (public booking)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Created }
        "400": { description: Validation error }
        "409": { description: Slot already taken }

  /api/shell/bootstrap:
    get:
      tags: [Shell]
      summary: CRM shell JSON (`kind`, lists, apiBase)
      description: Permissions depend on query `kind` (see info section).
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            description: dashboard | patients | patient-detail | doctors | schedule | inventory | settings | appointments-list | appointment-detail | reports | audit | ...
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: appointmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payload }
        "400": { description: Unknown kind or invalid UUIDs }

  /api/access/employees:
    get:
      tags: [Access]
      summary: Employees for access-control management
      x-required-permission: permission.read
      responses:
        "200": { description: OK }

  /api/access/employees/{employeeId}/permissions:
    get:
      tags: [Access]
      summary: Effective permissions for an employee
      x-required-permission: permission.read
      parameters:
        - $ref: "#/components/parameters/employeeId"
      responses:
        "200": { description: OK }
        "404": { description: Employee not found }
    put:
      tags: [Access]
      summary: Update permission overrides
      x-required-permission: permission.write
      parameters:
        - $ref: "#/components/parameters/employeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
        "400": { description: Invalid payload }

  /api/access/employees/{employeeId}/backdate-days:
    get:
      tags: [Access]
      summary: Backdate editing limit (per account)
      x-required-permission: permission.read
      parameters:
        - $ref: "#/components/parameters/employeeId"
      responses:
        "200": { description: OK }
    put:
      tags: [Access]
      summary: Set backdate limit
      x-required-permission: permission.write
      parameters:
        - $ref: "#/components/parameters/employeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer, minimum: 0 }
      responses:
        "200": { description: OK }

  /api/organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      x-required-permission: organization.read
      parameters:
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }
    post:
      tags: [Organizations]
      summary: Create organization
      x-required-permission: organization.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }

  /api/organizations/{id}:
    get:
      tags: [Organizations]
      summary: Organization by id
      x-required-permission: organization.read
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    patch:
      tags: [Organizations]
      summary: Update organization
      x-required-permission: organization.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [Organizations]
      summary: Delete organization
      x-required-permission: organization.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "204": { description: Deleted }

  /api/branches:
    get:
      tags: [Branches]
      summary: List branches
      x-required-permission: branch.read
      parameters:
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }
    post:
      tags: [Branches]
      summary: Create branch
      x-required-permission: branch.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }

  /api/branches/{id}:
    get:
      tags: [Branches]
      summary: Branch by id
      x-required-permission: branch.read
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }
    patch:
      tags: [Branches]
      summary: Update branch
      x-required-permission: branch.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [Branches]
      summary: Delete branch
      x-required-permission: branch.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "204": { description: Deleted }

  /api/employees/for-online-booking:
    get:
      tags: [Employees]
      summary: Employees for online booking widget (no pagination)
      x-required-permission: employee.read
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }

  /api/employees:
    get:
      tags: [Employees]
      summary: List employees
      x-required-permission: employee.read
      parameters:
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }
    post:
      tags: [Employees]
      summary: Create employee
      x-required-permission: employee.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }

  /api/employees/{id}:
    get:
      tags: [Employees]
      summary: Employee by id
      x-required-permission: employee.read
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }
    patch:
      tags: [Employees]
      summary: Update employee
      x-required-permission: employee.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [Employees]
      summary: Delete employee
      x-required-permission: employee.write
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "204": { description: Deleted }

  /api/rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      x-required-permission: schedule.view
      parameters:
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }
    post:
      tags: [Rooms]
      summary: Create room
      x-required-permission: schedule.view
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }

  /api/rooms/{id}:
    get:
      tags: [Rooms]
      summary: Room by id
      x-required-permission: schedule.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }
    patch:
      tags: [Rooms]
      summary: Update room
      x-required-permission: schedule.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK }
    delete:
      tags: [Rooms]
      summary: Delete room
      x-required-permission: schedule.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "204": { description: Deleted }

  /api/catalog/services:
    get:
      tags: [Catalog]
      summary: Medical services (price list)
      x-required-permission: settings.view
      responses:
        "200": { description: OK }

  /api/catalog/templates:
    get:
      tags: [Catalog]
      summary: Document templates
      x-required-permission: settings.view
      responses:
        "200": { description: OK }

  /api/catalog/integrations:
    get:
      tags: [Catalog]
      summary: Integrations
      x-required-permission: settings.view
      responses:
        "200": { description: OK }

  /api/catalog/patient-tag-types:
    get:
      tags: [Catalog]
      summary: Patient tag types
      x-required-permission: settings.view
      responses:
        "200": { description: OK }

  /api/catalog/roles:
    get:
      tags: [Catalog]
      summary: Roles (reference)
      x-required-permission: settings.view
      responses:
        "200": { description: OK }

  /api/system-settings:
    get:
      tags: [SystemSettings]
      summary: List system settings
      x-required-permission: settings.view
      parameters:
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
