  /api/inventory-operations/{id}:
    get:
      tags: [InventoryOperations]
      summary: Operation by id
      x-required-permission: inventory.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }

  /api/audit-logs:
    get:
      tags: [Audit]
      summary: Audit log (filters entityType, entityId, employeeId, dates)
      x-required-permission: audit.view
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }

  /api/audit-logs/medical-records:
    get:
      tags: [Audit]
      summary: Medical record audit trail
      x-required-permission: audit.view
      parameters:
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/pageablePage"
        - $ref: "#/components/parameters/pageableSize"
      responses:
        "200": { description: Page }

  /api/audit-logs/{id}:
    get:
      tags: [Audit]
      summary: Audit log entry by id
      x-required-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/idUuid"
      responses:
        "200": { description: OK }

  /api/reports/summary:
    get:
      tags: [Reports]
      summary: Summary for reports screen
      x-required-permission: reports.view
      responses:
        "200":
          description: Counters and links to REST resources
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /graphql:
    post:
      tags: [GraphQL]
      summary: GraphQL (queries/mutations)
      description: |
        Authentication required; **permission codes from `ApiAccessControlFilter` are not checked** for this path.
        Typical body: `{ "query": "...", "variables": { } }`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                variables: { type: object, additionalProperties: true }
                operationName: { type: string }
      responses:
        "200": { description: GraphQL JSON response }
        "401": { description: Unauthorized }

  /graphiql:
    get:
      tags: [GraphQL]
      summary: GraphiQL UI
      description: Available when `graphql.graphiql.enabled=true` (see `application.properties`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200": { description: HTML }

  /mvc/shell/bootstrap:
    get:
      tags: [Shell]
      summary: Legacy bootstrap JSON (same role as `/api/shell/bootstrap`)
      description: |
        Endpoint is `@Hidden` in code. Permissions are **not** applied via `requiredApiPermission` for `/mvc/**`
        (filter only covers `/api/**`); standard Micronaut JWT authentication is required.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: appointmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payload }
        "400": { description: Invalid parameters }

  /swagger-ui:
    get:
      tags: [Meta]
      summary: Redirect to Swagger UI
      description: Redirects to `/swagger-ui/index.html` (static UI + build-time spec).
      responses:
        "302": { description: Redirect }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `token` field in `/api/auth/login` response
    cookieAuth:
      type: apiKey
      in: cookie
      name: MIS_AUTH
      description: HttpOnly cookie (alternative to Bearer)

  parameters:
    idUuid:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    patientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    employeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    pageablePage:
      name: page
      in: query
      schema: { type: integer, minimum: 0 }
      description: Page number (Micronaut Pageable)
    pageableSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1 }
      description: Page size

  schemas:
    PermissionCode:
      type: string
      description: Codes from DB/seeds (see `V25__seed_access_permissions_and_role_matrix.sql`, `AccessPermissionCodes`)
      enum:
        - dashboard.view
        - posts.view
        - patients.view
        - doctors.view
        - schedule.view
        - appointments.view
        - reports.view
        - inventory.view
        - inventory.write
        - audit.view
        - settings.view
        - settings.write
        - employee.read
        - employee.write
        - branch.read
        - branch.write
        - organization.read
        - organization.write
        - permission.read
        - permission.write
        - finance.view
        - finance.write
        - egisz.manual.send
        - appointments.backdate.edit
