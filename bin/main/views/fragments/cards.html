<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="appointmentCard(time, patient, link, isNew)"
     class="m-appointment-card"
     th:classappend="${isNew} ? ' m-appointment-card--online' : ''">
    <strong th:text="${time}">09:00</strong>
    <span th:text="${patient}">Пациент</span>
    <span th:if="${isNew}" class="m-badge m-badge--new">Новая</span>
    <a th:href="@{${link}}" class="m-link">Открыть</a>
</div>
</body>
</html>
