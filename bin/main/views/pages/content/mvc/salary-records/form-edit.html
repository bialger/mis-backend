<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование записи зарплаты</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:36rem">
                <option th:each="e : ${employees}" th:value="${e.id}"
                        th:selected="${e.id == item.employeeId}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:36rem">
                <option th:each="b : ${branches}" th:value="${b.id}"
                        th:selected="${b.id == item.branchId}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Период с<br><input name="periodStart" style="width:100%;max-width:20rem" th:value="${item.periodStart}"></label></p>
        <p><label>Период по<br><input name="periodEnd" style="width:100%;max-width:20rem" th:value="${item.periodEnd}"></label></p>
        <p><label>Часы<br><input name="hoursWorked" style="width:100%;max-width:32rem" th:value="${item.hoursWorked}"></label></p>
        <p><label>Смены<br><input name="shiftsCount" style="width:100%;max-width:32rem" th:value="${item.shiftsCount}"></label></p>
        <p><label>Сумма<br><input name="amount" style="width:100%;max-width:32rem" th:value="${item.amount}"></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/salary-records/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/salary-records/' + id);
        })();
    </script>
</section>
</body>
</html>
