<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Запись зарплаты</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/salary-records}" accept-charset="UTF-8">
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:36rem">
                <option value="" disabled selected>— выберите сотрудника —</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:36rem">
                <option value="" disabled selected>— выберите филиал —</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Период с (yyyy-MM-dd)<br><input name="periodStart" placeholder="2025-01-01" style="width:100%;max-width:20rem"></label></p>
        <p><label>Период по<br><input name="periodEnd" placeholder="2025-01-31" style="width:100%;max-width:20rem"></label></p>
        <p><label>Часы<br><input name="hoursWorked" style="width:100%;max-width:32rem"></label></p>
        <p><label>Смены<br><input name="shiftsCount" style="width:100%;max-width:32rem"></label></p>
        <p><label>Сумма<br><input name="amount" style="width:100%;max-width:32rem"></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/salary-records}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
