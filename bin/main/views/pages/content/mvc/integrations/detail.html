<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.name}">name</h2>
        <p style="white-space: pre-wrap" th:text="${item.description}">desc</p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/integrations}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/integrations/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script th:inline="javascript">
        (function () {
            const b = document.getElementById('mvc-del');
            if (!b) return;
            b.addEventListener('click', function () {
                const id = b.getAttribute('data-id');
                if (!id || !confirm('Удалить?')) return;
                fetch('/mvc/integrations/' + id, { method: 'DELETE' }).then(function () {
                    window.location.href = '/mvc/integrations';
                });
            });
        })();
    </script>
</section>
</body>
</html>
