<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование пациента</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${patient != null}" accept-charset="UTF-8">
        <p><label>Организация<br>
            <select name="organizationId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="o : ${organizations}" th:value="${o.id}" th:selected="${o.id == patient.organizationId}" th:text="${o.name}"></option>
            </select>
        </label></p>
        <p><label>Номер карты<br><input name="cardNumber" required style="width:100%;max-width:32rem" th:value="${patient.cardNumber}"></label></p>
        <p><label>ФИО<br><input name="fullName" required style="width:100%;max-width:32rem" th:value="${patient.fullName}"></label></p>
        <p><label>Пол<br>
            <select name="gender" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option value="M" th:selected="${patient.gender != null and patient.gender.name() == 'M'}">М</option>
                <option value="F" th:selected="${patient.gender != null and patient.gender.name() == 'F'}">Ж</option>
            </select>
        </label></p>
        <p><label>Дата рождения<br><input name="birthDate" type="date" style="width:100%;max-width:32rem" th:value="${patient.birthDate != null ? #temporals.format(patient.birthDate, 'yyyy-MM-dd') : ''}"></label></p>
        <p><label>Телефон<br><input name="phone" style="width:100%;max-width:32rem" th:value="${patient.phone}"></label></p>
        <p><label>Email<br><input name="email" type="email" style="width:100%;max-width:32rem" th:value="${patient.email}"></label></p>
        <p><label>Адрес регистрации<br><textarea name="registrationAddress" rows="3" style="width:100%;max-width:32rem" th:text="${patient.registrationAddress}"></textarea></label></p>
        <p><label>Адрес проживания<br><textarea name="residenceAddress" rows="3" style="width:100%;max-width:32rem" th:text="${patient.residenceAddress}"></textarea></label></p>
        <p><label>Тип местности<br>
            <select name="localityType" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option value="URBAN" th:selected="${patient.localityType != null and patient.localityType.name() == 'URBAN'}">Городская</option>
                <option value="RURAL" th:selected="${patient.localityType != null and patient.localityType.name() == 'RURAL'}">Сельская</option>
            </select>
        </label></p>
        <p><label>Гражданство<br><input name="citizenship" style="width:100%;max-width:32rem" th:value="${patient.citizenship}"></label></p>
        <p><label>Документ (текст)<br><input name="identityDocument" style="width:100%;max-width:32rem" th:value="${patient.identityDocument}"></label></p>
        <p><label>Полис ОМС<br><input name="omsPolicy" style="width:100%;max-width:32rem" th:value="${patient.omsPolicy}"></label></p>
        <p><label>СНИЛС<br><input name="snils" style="width:100%;max-width:32rem" th:value="${patient.snils}"></label></p>
        <p><label>Страховая организация<br><input name="insuranceOrganization" style="width:100%;max-width:32rem" th:value="${patient.insuranceOrganization}"></label></p>
        <p><label>Контактное лицо<br><input name="contactPerson" style="width:100%;max-width:32rem" th:value="${patient.contactPerson}"></label></p>
        <p><label>Опекун / представитель<br><input name="guardian" style="width:100%;max-width:32rem" th:value="${patient.guardian}"></label></p>
        <p><label>Профессия<br><input name="profession" style="width:100%;max-width:32rem" th:value="${patient.profession}"></label></p>
        <p><label>Место работы<br><input name="workplace" style="width:100%;max-width:32rem" th:value="${patient.workplace}"></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/patients/{id}(id=${patient.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${patient != null}">
        (function () {
            const id = /*[[${patient.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/patients/' + id);
        })();
    </script>
</section>
</body>
</html>
