<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Лабораторный тест</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/lab-tests}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Описание<br><textarea name="description" rows="3" style="width:100%;max-width:32rem"></textarea></label></p>
        <p><label>Цена<br><input name="price" placeholder="0.00" style="width:100%;max-width:32rem"></label></p>
        <p><label>Лаборатория<br>
            <select name="laboratoryId" style="width:100%;max-width:32rem">
                <option value="">— не привязано —</option>
                <option th:each="lab : ${laboratories}" th:value="${lab.id}" th:text="${lab.name}"></option>
            </select>
        </label></p>
        <p><label><input type="checkbox" name="isActive" value="on" checked> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/lab-tests}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
