<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.fullName}">name</h2>
        <p th:if="${item.email != null}"><strong>Email:</strong> <span th:text="${item.email}"></span></p>
        <p th:if="${item.phone != null}"><strong>Тел.:</strong> <span th:text="${item.phone}"></span></p>
        <p><strong>Активен:</strong> <span th:text="${item.isActive} ? 'да' : 'нет'"></span></p>
        <div th:if="${specialtyNames != null && !specialtyNames.isEmpty()}">
            <p><strong>Специализации:</strong></p>
            <ul>
                <li th:each="n : ${specialtyNames}" th:text="${n}">—</li>
            </ul>
        </div>
        <div th:if="${branchNames != null && !branchNames.isEmpty()}">
            <p><strong>Филиалы:</strong></p>
            <ul>
                <li th:each="n : ${branchNames}" th:text="${n}">—</li>
            </ul>
        </div>
        <div th:if="${roleNames != null && !roleNames.isEmpty()}">
            <p><strong>Роли:</strong></p>
            <ul>
                <li th:each="n : ${roleNames}" th:text="${n}">—</li>
            </ul>
        </div>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/employees}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/employees/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script th:inline="javascript">
        (function () {
            const b = document.getElementById('mvc-del');
            if (!b) return;
            b.addEventListener('click', function () {
                const id = b.getAttribute('data-id');
                if (!id || !confirm('Удалить?')) return;
                fetch('/mvc/employees/' + id, { method: 'DELETE' }).then(function () {
                    window.location.href = '/mvc/employees';
                });
            });
        })();
    </script>
</section>
</body>
</html>
