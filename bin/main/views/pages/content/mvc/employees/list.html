<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Сотрудники</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/employees/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(items)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(items)}" class="m-card">
        <li th:each="item : ${items}">
            <a th:href="@{/mvc/employees/{id}(id=${item.id})}" th:text="${item.fullName}">name</a>
            <span th:if="${item.email != null}" class="m-section" th:text="|(${item.email})|">email</span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
