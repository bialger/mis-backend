<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование сотрудника</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <p class="m-section">Новый пароль — только если меняете; иначе оставьте поле пустым.</p>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>ФИО<br><input name="fullName" required style="width:100%;max-width:32rem" th:value="${item.fullName}"></label></p>
        <p><label>Email<br><input name="email" type="email" style="width:100%;max-width:32rem" th:value="${item.email}"></label></p>
        <p><label>Телефон<br><input name="phone" style="width:100%;max-width:32rem" th:value="${item.phone}"></label></p>
        <p><label>Новый пароль<br><input name="password" type="password" autocomplete="new-password" style="width:100%;max-width:32rem"></label></p>
        <p th:if="${roles != null}"><label>Роль<br>
            <select name="roleId" id="employee-role-id" required style="width:100%;max-width:32rem">
                <option value="" th:selected="${employeeRoleId == null or #strings.isEmpty(employeeRoleId)}">— выберите роль —</option>
                <option th:each="r : ${roles}" th:value="${r.id}"
                        th:selected="${employeeRoleId != null and !#strings.isEmpty(employeeRoleId) and employeeRoleId == r.id.toString()}"
                        th:text="${r.displayName != null ? r.displayName : r.name}"
                        th:attr="data-role-name=${r.name}">role</option>
            </select>
        </label></p>
        <fieldset class="m-section" id="employee-specialty-fieldset" th:if="${specialties != null}">
            <legend>Специализации</legend>
            <p class="m-section" style="font-size:0.9rem;opacity:0.85;">Для ролей «Администратор» и «Медсестра» специализации не задаются.</p>
            <th:block th:each="s : ${specialties}">
                <label style="display:block;margin:0.25rem 0;">
                    <input type="checkbox" name="specialtyIds" th:value="${s.id}"
                           th:checked="${employeeSpecialtyIds.contains(s.id.toString())}">
                    <span th:text="${s.name}">spec</span>
                </label>
            </th:block>
        </fieldset>
        <fieldset class="m-section" th:if="${branches != null}">
            <legend>Филиалы</legend>
            <th:block th:each="b : ${branches}">
                <label style="display:block;margin:0.25rem 0;">
                    <input type="checkbox" name="branchIds" th:value="${b.id}"
                           th:checked="${employeeBranchIds.contains(b.id.toString())}">
                    <span th:text="${b.name}">branch</span>
                </label>
            </th:block>
        </fieldset>
        <p><label><input type="checkbox" name="isActive" value="on" th:checked="${item.isActive}"> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/employees/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script>
        (function () {
            var sel = document.getElementById('employee-role-id');
            var fs = document.getElementById('employee-specialty-fieldset');
            if (!sel || !fs) return;
            var NO = ['ADMIN', 'NURSE'];
            function sync() {
                var opt = sel.options[sel.selectedIndex];
                var name = opt.getAttribute('data-role-name');
                var disabled = name && NO.indexOf(name) >= 0;
                fs.disabled = disabled;
                if (disabled) {
                    fs.querySelectorAll('input[name="specialtyIds"]').forEach(function (cb) { cb.checked = false; });
                }
            }
            sel.addEventListener('change', sync);
            sync();
        })();
    </script>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/employees/' + id);
        })();
    </script>
</section>
</body>
</html>
