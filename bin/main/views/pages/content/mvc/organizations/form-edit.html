<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование организации</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem" th:value="${item.name}"></label></p>
        <p><label>Код ОКПО<br><input name="codeOkpo" style="width:100%;max-width:32rem" th:value="${item.codeOkpo}"></label></p>
        <p><label>Код ОКУД<br><input name="codeOkud" style="width:100%;max-width:32rem" th:value="${item.codeOkud}"></label></p>
        <p><label>Адрес<br><textarea name="address" rows="3" style="width:100%;max-width:32rem" th:text="${item.address}"></textarea></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/organizations/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/organizations/' + id);
        })();
    </script>
</section>
</body>
</html>
