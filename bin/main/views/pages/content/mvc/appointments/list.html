<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Приёмы</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/appointments/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(rows)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(rows)}" class="m-card">
        <li th:each="row : ${rows}">
            <a th:href="@{/mvc/appointments/{id}(id=${row.appointment.id})}" th:text="${row.patientName}">patient</a>
            <span class="m-section"><span th:text="${row.appointment.status}">st</span><span th:if="${row.slotLabel != null}" th:text="| · ${row.slotLabel}|"></span></span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
