#Mon Mar 02 17:04:38 MSK 2026
micronaut.application.name=mis
micronaut.router.static-resources.frontend.mapping=/assets/**
micronaut.router.static-resources.frontend.paths=classpath:static
micronaut.server.host=0.0.0.0
micronaut.server.port=8000
micronaut.server.dispatch-options-requests=true

# CORS
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.default.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:`https://mis.bialger.com,http://localhost:3000,http://localhost:5173`}
micronaut.server.cors.configurations.default.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
micronaut.server.cors.configurations.default.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,If-None-Match
micronaut.server.cors.configurations.default.exposed-headers=ETag,Link,X-Elapsed-Time
micronaut.server.cors.configurations.default.allow-credentials=true

# Security (JWT Cookie + Bearer)
micronaut.security.enabled=true
micronaut.security.redirect.enabled=false
micronaut.security.authentication=cookie
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false
micronaut.security.token.enabled=true
micronaut.security.token.bearer.enabled=true
micronaut.security.token.cookie.enabled=true
micronaut.security.token.cookie.cookie-name=MIS_AUTH
micronaut.security.token.cookie.cookie-path=/
micronaut.security.token.cookie.cookie-http-only=true
micronaut.security.token.cookie.cookie-secure=${JWT_COOKIE_SECURE:true}
micronaut.security.token.cookie.cookie-same-site=Lax
micronaut.security.token.jwt.enabled=true
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET}
micronaut.security.token.jwt.generator.refresh-token.enabled=false
micronaut.security.token.generator.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:28800}

# Access matrix
micronaut.security.intercept-url-map[0].pattern=/**
micronaut.security.intercept-url-map[0].http-method=OPTIONS
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/assets/**
micronaut.security.intercept-url-map[1].http-method=GET
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/login
micronaut.security.intercept-url-map[2].http-method=GET
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/patient-booking
micronaut.security.intercept-url-map[3].http-method=GET
micronaut.security.intercept-url-map[3].access[0]=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/api/auth/login
micronaut.security.intercept-url-map[4].http-method=POST
micronaut.security.intercept-url-map[4].access[0]=isAnonymous()
micronaut.security.intercept-url-map[5].pattern=/api/auth/first-password-change
micronaut.security.intercept-url-map[5].http-method=POST
micronaut.security.intercept-url-map[5].access[0]=isAnonymous()
micronaut.security.intercept-url-map[6].pattern=/api/public/booking/**
micronaut.security.intercept-url-map[6].http-method=GET
micronaut.security.intercept-url-map[6].access[0]=isAnonymous()
micronaut.security.intercept-url-map[7].pattern=/api/public/booking/appointments
micronaut.security.intercept-url-map[7].http-method=POST
micronaut.security.intercept-url-map[7].access[0]=isAnonymous()
micronaut.security.intercept-url-map[8].pattern=/**
micronaut.security.intercept-url-map[8].access[0]=isAuthenticated()

# Database (PostgreSQL)
# Override via env: MICRONAUT_DATASOURCES_DEFAULT_URL, USERNAME, PASSWORD
datasources.default.url=${MICRONAUT_DATASOURCES_DEFAULT_URL:`jdbc:postgresql://localhost:1432/mis`}
datasources.default.username=${MICRONAUT_DATASOURCES_DEFAULT_USERNAME:mis}
datasources.default.password=${MICRONAUT_DATASOURCES_DEFAULT_PASSWORD:mis}
datasources.default.driver-class-name=org.postgresql.Driver

# Flyway migrations
flyway.datasources.default.enabled=true

# Micronaut Data JDBC
jdbc.repositories.default.enabled=true

# OpenAPI generated spec (build-time)
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# Multipart file uploads
micronaut.server.multipart.enabled=true
micronaut.server.multipart.max-file-size=10485760

# Yandex Object Storage (S3-compatible). Keys come from env variables.
yc.key=${YC_KEY:changeme}
yc.secret=${YC_SECRET:changeme}
yc.bucket=${YC_BUCKET:mis-bialger}

# In-memory cache: branches (TTL 5 s — good balance between freshness and read relief)
micronaut.caches.branches.maximum-size=200
micronaut.caches.branches.expire-after-write=5s

graphql.enabled=true
graphql.path=/graphql
graphql.graphiql.enabled=true
graphql.graphiql.path=/graphiql
