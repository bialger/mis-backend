#Mon Mar 02 17:04:38 MSK 2026
micronaut.application.name=mis
micronaut.router.static-resources.frontend.mapping=/assets/**
micronaut.router.static-resources.frontend.paths=classpath:static
micronaut.server.host=0.0.0.0
micronaut.server.port=8000

# Database (PostgreSQL)
# Override via env: MICRONAUT_DATASOURCES_DEFAULT_URL, USERNAME, PASSWORD
datasources.default.url=${MICRONAUT_DATASOURCES_DEFAULT_URL:`jdbc:postgresql://localhost:1432/mis`}
datasources.default.username=${MICRONAUT_DATASOURCES_DEFAULT_USERNAME:mis}
datasources.default.password=${MICRONAUT_DATASOURCES_DEFAULT_PASSWORD:mis}
datasources.default.driver-class-name=org.postgresql.Driver

# Flyway migrations
flyway.datasources.default.enabled=true

# Micronaut Data JDBC
jdbc.repositories.default.enabled=true

# OpenAPI generated spec (build-time)
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
