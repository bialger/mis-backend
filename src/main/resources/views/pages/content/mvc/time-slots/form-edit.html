<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование слота</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${slot != null}" accept-charset="UTF-8">
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:selected="${e.id == slot.employeeId}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Кабинет<br>
            <select name="roomId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:selected="${r.id == slot.roomId}" th:text="${r.name}"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:selected="${b.id == slot.branchId}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Дата<br><input name="slotDate" type="date" required style="width:100%;max-width:32rem" th:value="${#temporals.format(slot.slotDate, 'yyyy-MM-dd')}"></label></p>
        <p><label>Начало<br><input name="startTime" type="time" required style="width:100%;max-width:32rem" th:value="${#temporals.format(slot.startTime, 'HH:mm')}"></label></p>
        <p><label>Окончание<br><input name="endTime" type="time" required style="width:100%;max-width:32rem" th:value="${#temporals.format(slot.endTime, 'HH:mm')}"></label></p>
        <p><label>Свободен<br>
            <select name="isAvailable" style="width:100%;max-width:32rem">
                <option value="true" th:selected="${slot.isAvailable}">Да</option>
                <option value="false" th:selected="${!slot.isAvailable}">Нет</option>
            </select>
        </label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/time-slots/{id}(id=${slot.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${slot != null}">
        (function () {
            const id = /*[[${slot.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/time-slots/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    var detailUrl = '/mvc/time-slots/' + id;
                    if (r.redirected) {
                        window.location.href = detailUrl;
                        return;
                    }
                    window.location.reload();
                }).catch(function () {
                    window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
