<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${slot != null}">
        <h2 th:text="|${slot.slotDate} ${slot.startTime}–${slot.endTime}|">slot</h2>
        <p><strong>Сотрудник:</strong> <span th:text="${employeeName}">—</span></p>
        <p><strong>Филиал:</strong> <span th:text="${branchName}">—</span></p>
        <p><strong>Кабинет:</strong> <span th:text="${roomName}">—</span></p>
        <p><strong>Свободен:</strong> <span th:text="${slot.isAvailable} ? 'да' : 'нет'">—</span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/time-slots}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/time-slots/{id}/edit(id=${slot.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${slot.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/time-slots/', '/mvc/time-slots');
    </script>
</section>
</body>
</html>
