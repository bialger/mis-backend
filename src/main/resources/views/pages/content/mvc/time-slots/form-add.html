<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Новый слот</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/time-slots}" accept-charset="UTF-8">
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Кабинет<br>
            <select name="roomId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Дата<br><input name="slotDate" type="date" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Начало<br><input name="startTime" type="time" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Окончание<br><input name="endTime" type="time" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Свободен<br>
            <select name="isAvailable" style="width:100%;max-width:32rem">
                <option value="true" selected>Да</option>
                <option value="false">Нет</option>
            </select>
        </label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/time-slots}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
