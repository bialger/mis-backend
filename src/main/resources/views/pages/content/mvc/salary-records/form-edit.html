<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование записи зарплаты</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Сотрудник (UUID)<br><input name="employeeId" required style="width:100%;max-width:36rem" th:value="${item.employeeId}"></label></p>
        <p><label>Филиал (UUID)<br><input name="branchId" required style="width:100%;max-width:36rem" th:value="${item.branchId}"></label></p>
        <p><label>Период с<br><input name="periodStart" style="width:100%;max-width:20rem" th:value="${item.periodStart}"></label></p>
        <p><label>Период по<br><input name="periodEnd" style="width:100%;max-width:20rem" th:value="${item.periodEnd}"></label></p>
        <p><label>Часы<br><input name="hoursWorked" style="width:100%;max-width:20rem" th:value="${item.hoursWorked}"></label></p>
        <p><label>Смены<br><input name="shiftsCount" style="width:100%;max-width:20rem" th:value="${item.shiftsCount}"></label></p>
        <p><label>Сумма<br><input name="amount" style="width:100%;max-width:20rem" th:value="${item.amount}"></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/salary-records/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/salary-records/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    var detailUrl = '/mvc/salary-records/' + id;
                    if (r.redirected) {
                        window.location.href = detailUrl;
                        return;
                    }
                    window.location.reload();
                }).catch(function () {
                    window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
