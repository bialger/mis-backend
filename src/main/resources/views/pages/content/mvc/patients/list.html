<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Пациенты</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/patients/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(patients)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(patients)}" class="m-card">
        <li th:each="p : ${patients}">
            <a th:href="@{/mvc/patients/{id}(id=${p.id})}" th:text="${p.fullName}">name</a>
            <span class="m-section" th:text="|карта ${p.cardNumber}|">meta</span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
