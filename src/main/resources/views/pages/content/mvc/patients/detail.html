<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${patient != null}">
        <h2 th:text="${patient.fullName}">name</h2>
        <p><strong>Карта:</strong> <span th:text="${patient.cardNumber}">—</span></p>
        <p><strong>Организация:</strong> <span th:text="${organizationName}">—</span></p>
        <p th:if="${patient.gender != null}"><strong>Пол:</strong> <span th:text="${patient.gender.name() == 'M'} ? 'М' : 'Ж'">—</span></p>
        <p th:if="${patient.birthDate != null}"><strong>Дата рождения:</strong> <span th:text="${patient.birthDate}">—</span></p>
        <p th:if="${patient.phone != null}"><strong>Телефон:</strong> <span th:text="${patient.phone}">—</span></p>
        <p th:if="${patient.email != null}"><strong>Email:</strong> <span th:text="${patient.email}">—</span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/patients}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/patients/{id}/edit(id=${patient.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${patient.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script th:inline="javascript">
        (function () {
            const b = document.getElementById('mvc-del');
            if (!b) return;
            b.addEventListener('click', function () {
                const id = b.getAttribute('data-id');
                if (!id || !confirm('Удалить?')) return;
                fetch('/mvc/patients/' + id, { method: 'DELETE' }).then(function () {
                    window.location.href = '/mvc/patients';
                });
            });
        })();
    </script>
</section>
</body>
</html>
