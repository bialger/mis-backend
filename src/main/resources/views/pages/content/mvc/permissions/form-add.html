<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Право</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/permissions}" accept-charset="UTF-8">
        <p><label>Код (например patient.view)<br><input name="code" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Название<br><input name="name" style="width:100%;max-width:32rem"></label></p>
        <p><label>Описание<br><textarea name="description" rows="3" style="width:100%;max-width:32rem"></textarea></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/permissions}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
