<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.code}">code</h2>
        <p th:if="${item.name != null}"><strong>Название:</strong> <span th:text="${item.name}"></span></p>
        <p th:if="${item.description != null}" style="white-space: pre-wrap" th:text="${item.description}"></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/permissions}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/permissions/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/permissions/', '/mvc/permissions');
    </script>
</section>
</body>
</html>
