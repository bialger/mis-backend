<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Платежи</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/payments/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(rows)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(rows)}" class="m-card">
        <li th:each="row : ${rows}">
            <a th:href="@{/mvc/payments/{id}(id=${row.payment.id})}" th:text="|${row.patientName} — ${row.payment.amount}|">pay</a>
            <span class="m-section" th:text="${row.payment.paymentStatus}">st</span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
