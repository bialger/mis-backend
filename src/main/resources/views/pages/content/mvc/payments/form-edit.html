<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование платежа</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${payment != null}" accept-charset="UTF-8">
        <p><label>Приём<br>
            <select name="appointmentId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="o : ${appointmentOptions}" th:value="${o.id}" th:selected="${o.id == payment.appointmentId}" th:text="${o.label}"></option>
            </select>
        </label></p>
        <p><label>Сумма<br><input name="amount" required style="width:100%;max-width:32rem" th:value="${payment.amount}"></label></p>
        <p><label>Способ<br>
            <select name="paymentMethod" required style="width:100%;max-width:32rem">
                <option th:each="m : ${paymentMethods}" th:value="${m.name()}" th:selected="${m == payment.paymentMethod}" th:text="${m.name()}"></option>
            </select>
        </label></p>
        <p><label>Статус оплаты<br>
            <select name="paymentStatus" required style="width:100%;max-width:32rem">
                <option th:each="s : ${paymentStatuses}" th:value="${s.name()}" th:selected="${s == payment.paymentStatus}" th:text="${s.name()}"></option>
            </select>
        </label></p>
        <p><label>Кто провёл<br>
            <select name="createdBy" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:selected="${e.id == payment.createdBy}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Заметки<br><textarea name="notes" rows="2" style="width:100%;max-width:32rem" th:text="${payment.notes != null ? payment.notes : ''}"></textarea></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/payments/{id}(id=${payment.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${payment != null}">
        (function () {
            const id = /*[[${payment.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/payments/' + id, {
                    method: 'PATCH',
                    redirect: 'manual',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    var detailUrl = '/mvc/payments/' + id;
                    var loc = r.headers.get('Location');
                    if (r.status >= 300 && r.status < 400) {
                        window.location.href = loc ? new URL(loc, window.location.origin).href : detailUrl;
                        return;
                    }
                    window.location.reload();
                }).catch(function () {
                    window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
