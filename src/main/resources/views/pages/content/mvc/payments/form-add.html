<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Новый платёж</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/payments}" accept-charset="UTF-8">
        <p><label>Приём<br>
            <select name="appointmentId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="o : ${appointmentOptions}" th:value="${o.id}" th:text="${o.label}"></option>
            </select>
        </label></p>
        <p><label>Сумма<br><input name="amount" required style="width:100%;max-width:32rem" placeholder="0.00"></label></p>
        <p><label>Способ<br>
            <select name="paymentMethod" required style="width:100%;max-width:32rem">
                <option th:each="m : ${paymentMethods}" th:value="${m.name()}" th:text="${m.name()}"></option>
            </select>
        </label></p>
        <p><label>Статус оплаты<br>
            <select name="paymentStatus" required style="width:100%;max-width:32rem">
                <option th:each="s : ${paymentStatuses}" th:value="${s.name()}" th:text="${s.name()}"></option>
            </select>
        </label></p>
        <p><label>Кто провёл<br>
            <select name="createdBy" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Заметки<br><textarea name="notes" rows="2" style="width:100%;max-width:32rem"></textarea></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/payments}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
