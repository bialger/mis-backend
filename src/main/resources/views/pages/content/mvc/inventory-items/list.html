<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Позиции склада</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/inventory-items/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(items)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(items)}" class="m-card">
        <li th:each="row : ${items}">
            <a th:href="@{/mvc/inventory-items/{id}(id=${row.item.id})}" th:text="${row.item.name}">name</a>
            <span class="m-section" th:text="|${row.categoryName} · ${row.branchName}|">meta</span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
