<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Сотрудник</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <p class="m-section">Пароль хранится в виде BCrypt-хеша.</p>
    <form class="m-card m-section" method="post" th:action="@{/mvc/employees}" accept-charset="UTF-8">
        <p><label>ФИО<br><input name="fullName" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Email<br><input name="email" type="email" style="width:100%;max-width:32rem"></label></p>
        <p><label>Телефон<br><input name="phone" style="width:100%;max-width:32rem"></label></p>
        <p><label>Пароль<br><input name="password" type="password" required autocomplete="new-password" style="width:100%;max-width:32rem"></label></p>
        <p th:if="${roles != null}"><label>Роль<br>
            <select name="roleId" id="employee-role-id" required style="width:100%;max-width:32rem">
                <option value="" disabled selected>— выберите роль —</option>
                <option th:each="r : ${roles}" th:value="${r.id}"
                        th:text="${r.displayName != null ? r.displayName : r.name}"
                        th:attr="data-role-name=${r.name}">role</option>
            </select>
        </label></p>
        <fieldset class="m-section" id="employee-specialty-fieldset" th:if="${specialties != null}">
            <legend>Специализации</legend>
            <p class="m-section" style="font-size:0.9rem;opacity:0.85;">Для ролей «Администратор» и «Медсестра» специализации не задаются.</p>
            <th:block th:each="s : ${specialties}">
                <label style="display:block;margin:0.25rem 0;">
                    <input type="checkbox" name="specialtyIds" th:value="${s.id}">
                    <span th:text="${s.name}">spec</span>
                </label>
            </th:block>
        </fieldset>
        <p><label>Время приёма (онлайн-запись)<br>
            <input name="workStartTime" type="time" style="max-width:8rem"> —
            <input name="workEndTime" type="time" style="max-width:8rem">
        </label></p>
        <p class="m-section" style="font-size:0.9rem;opacity:0.85;">Пусто — для записи используются только часы филиала.</p>
        <fieldset class="m-section" th:if="${branches != null}">
            <legend>Филиалы</legend>
            <th:block th:each="b : ${branches}">
                <label style="display:block;margin:0.25rem 0;">
                    <input type="checkbox" name="branchIds" th:value="${b.id}">
                    <span th:text="${b.name}">branch</span>
                </label>
            </th:block>
        </fieldset>
        <p><label><input type="checkbox" name="isActive" checked> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/employees}">Отмена</a>
        </p>
    </form>
    <script>
        (function () {
            var sel = document.getElementById('employee-role-id');
            var fs = document.getElementById('employee-specialty-fieldset');
            if (!sel || !fs) return;
            var NO = ['ADMIN', 'NURSE'];
            function sync() {
                var opt = sel.options[sel.selectedIndex];
                var name = opt.getAttribute('data-role-name');
                var disabled = name && NO.indexOf(name) >= 0;
                fs.disabled = disabled;
                if (disabled) {
                    fs.querySelectorAll('input[name="specialtyIds"]').forEach(function (cb) { cb.checked = false; });
                }
            }
            sel.addEventListener('change', sync);
            sync();
        })();
    </script>
</section>
</body>
</html>
