<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Шаблон</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/templates}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Тип<br>
            <select name="type" required>
                <option th:each="t : ${templateTypes}" th:value="${t.name()}" th:text="${t.name()}"></option>
            </select>
        </label></p>
        <p><label>Специализация (UUID)<br><input name="specialtyId" placeholder="опционально" style="width:100%;max-width:32rem"></label></p>
        <p><label>Сотрудник (UUID)<br><input name="employeeId" placeholder="опционально" style="width:100%;max-width:32rem"></label></p>
        <p><label>Содержимое<br><textarea name="content" required rows="10" style="width:100%;max-width:40rem"></textarea></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" checked> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/templates}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
