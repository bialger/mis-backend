<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование шаблона</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem" th:value="${item.name}"></label></p>
        <p><label>Тип<br>
            <select name="type" required>
                <option th:each="t : ${templateTypes}" th:value="${t.name()}" th:text="${t.name()}" th:selected="${item.type == t}"></option>
            </select>
        </label></p>
        <p><label>Специализация<br>
            <select name="specialtyId" style="width:100%;max-width:32rem">
                <option value="">— не выбрано —</option>
                <option th:each="s : ${specialties}" th:value="${s.id}"
                        th:selected="${item.specialtyId != null and item.specialtyId == s.id}" th:text="${s.name}"></option>
            </select>
        </label></p>
        <p><label>Сотрудник<br>
            <select name="employeeId" style="width:100%;max-width:32rem">
                <option value="">— не выбрано —</option>
                <option th:each="e : ${employees}" th:value="${e.id}"
                        th:selected="${item.employeeId != null and item.employeeId == e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Содержимое<br><textarea name="content" required rows="10" style="width:100%;max-width:40rem" th:text="${item.content}"></textarea></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" th:checked="${item.isActive}"> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/templates/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/templates/' + id);
        })();
    </script>
</section>
</body>
</html>
