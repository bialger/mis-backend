<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование шаблона</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem" th:value="${item.name}"></label></p>
        <p><label>Тип<br>
            <select name="type" required>
                <option th:each="t : ${templateTypes}" th:value="${t.name()}" th:text="${t.name()}" th:selected="${item.type == t}"></option>
            </select>
        </label></p>
        <p><label>Специализация (UUID)<br><input name="specialtyId" style="width:100%;max-width:32rem" th:value="${item.specialtyId}"></label></p>
        <p><label>Сотрудник (UUID)<br><input name="employeeId" style="width:100%;max-width:32rem" th:value="${item.employeeId}"></label></p>
        <p><label>Содержимое<br><textarea name="content" required rows="10" style="width:100%;max-width:40rem" th:text="${item.content}"></textarea></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" th:checked="${item.isActive}"> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/templates/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/templates/' + id, {
                    method: 'PATCH',
                    redirect: 'manual',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    var detailUrl = '/mvc/templates/' + id;
                    var loc = r.headers.get('Location');
                    if (r.status >= 300 && r.status < 400) {
                        window.location.href = loc ? new URL(loc, window.location.origin).href : detailUrl;
                        return;
                    }
                    window.location.reload();
                }).catch(function () {
                    window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
