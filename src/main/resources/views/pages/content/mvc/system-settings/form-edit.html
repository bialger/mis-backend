<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование настройки</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Филиал<br>
            <select name="branchId" style="width:100%;max-width:36rem">
                <option value="" th:selected="${item.branchId == null}">— глобально (все филиалы) —</option>
                <option th:each="b : ${branches}" th:value="${b.id}"
                        th:selected="${item.branchId != null and item.branchId == b.id}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Ключ<br><input name="key" required maxlength="100" style="width:100%;max-width:32rem" th:value="${item.key}"></label></p>
        <p><label>Значение<br><textarea name="value" rows="3" style="width:100%;max-width:40rem" th:text="${item.value}"></textarea></label></p>
        <p><label>Описание<br><textarea name="description" rows="2" style="width:100%;max-width:40rem" th:text="${item.description}"></textarea></label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/system-settings/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/system-settings/' + id);
        })();
    </script>
</section>
</body>
</html>
