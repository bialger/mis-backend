<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Лабораторные тесты</h2>
    <p><a class="m-tab-button" th:href="@{/mvc/lab-tests/add}">Добавить</a></p>
    <div th:if="${#lists.isEmpty(items)}" class="m-card"><p>Нет записей.</p></div>
    <ul th:unless="${#lists.isEmpty(items)}" class="m-card">
        <li th:each="row : ${items}">
            <a th:href="@{/mvc/lab-tests/{id}(id=${row.test.id})}" th:text="${row.test.name}">name</a>
            <span th:if="${row.laboratoryName != null}" class="m-section" th:text="|(${row.laboratoryName})|">lab</span>
        </li>
    </ul>
    <div th:replace="~{fragments/mvc-sse :: client}"></div>
</section>
</body>
</html>
