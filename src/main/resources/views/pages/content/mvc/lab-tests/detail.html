<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.name}">name</h2>
        <p th:if="${laboratoryName != null and !#strings.isEmpty(laboratoryName)}"><strong>Лаборатория:</strong> <span th:text="${laboratoryName}"></span></p>
        <p th:if="${item.price != null}"><strong>Цена:</strong> <span th:text="${item.price}"></span></p>
        <p th:if="${item.description != null}" style="white-space: pre-wrap" th:text="${item.description}"></p>
        <p><strong>Активен:</strong> <span th:text="${item.isActive} ? 'да' : 'нет'"></span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/lab-tests}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/lab-tests/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/lab-tests/', '/mvc/lab-tests');
    </script>
</section>
</body>
</html>
