<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.name}">name</h2>
        <p th:if="${organizationName != null}"><strong>Организация:</strong> <span th:text="${organizationName}"></span></p>
        <p th:if="${item.address != null}" style="white-space: pre-wrap" th:text="${item.address}"></p>
        <p th:if="${item.phone != null}"><strong>Тел.:</strong> <span th:text="${item.phone}"></span></p>
        <p><strong>Время работы:</strong>
            <span th:text="${#temporals.format(item.startTime, 'HH:mm')}"></span> —
            <span th:text="${#temporals.format(item.endTime, 'HH:mm')}"></span></p>
        <p><strong>Активен:</strong> <span th:text="${item.isActive} ? 'да' : 'нет'"></span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/branches}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/branches/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/branches/', '/mvc/branches');
    </script>
</section>
</body>
</html>
