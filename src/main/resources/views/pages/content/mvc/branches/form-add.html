<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Филиал</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/branches}" accept-charset="UTF-8">
        <p><label>Организация<br>
            <select name="organizationId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="o : ${organizations}" th:value="${o.id}" th:text="${o.name}"></option>
            </select>
        </label></p>
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Адрес<br><textarea name="address" rows="3" style="width:100%;max-width:32rem"></textarea></label></p>
        <p><label>Телефон<br><input name="phone" style="width:100%;max-width:32rem"></label></p>
        <p><label>Время работы филиала<br>
            <input name="startTime" type="time" value="08:00" style="max-width:8rem"> —
            <input name="endTime" type="time" value="20:00" style="max-width:8rem">
        </label></p>
        <p class="m-section" style="font-size:0.9rem;opacity:0.85;">Оставьте 08:00–20:00 или задайте свои границы приёма для онлайн-записи.</p>
        <p><label><input type="checkbox" name="isActive" checked> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/branches}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
