<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование филиала</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Организация<br>
            <select name="organizationId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="o : ${organizations}" th:value="${o.id}" th:selected="${o.id == item.organizationId}" th:text="${o.name}"></option>
            </select>
        </label></p>
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem" th:value="${item.name}"></label></p>
        <p><label>Адрес<br><textarea name="address" rows="3" style="width:100%;max-width:32rem" th:text="${item.address}"></textarea></label></p>
        <p><label>Телефон<br><input name="phone" style="width:100%;max-width:32rem" th:value="${item.phone}"></label></p>
        <p><label><input type="checkbox" name="isActive" value="on" th:checked="${item.isActive}"> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/branches/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/branches/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    if (r.ok || (r.status >= 300 && r.status < 400)) window.location.href = '/mvc/branches/' + id;
                    else window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
