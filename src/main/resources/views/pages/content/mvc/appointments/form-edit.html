<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование приёма</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${appointment != null}" accept-charset="UTF-8">
        <p><label>Пациент<br>
            <select name="patientId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="p : ${patients}" th:value="${p.id}" th:selected="${p.id == appointment.patientId}" th:text="${p.fullName}"></option>
            </select>
        </label></p>
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:selected="${e.id == appointment.employeeId}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Слот (необязательно)<br>
            <select name="timeSlotId" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="ts : ${timeSlots}" th:value="${ts.id}" th:selected="${appointment.timeSlotId != null and ts.id == appointment.timeSlotId}" th:text="|${ts.slotDate} ${ts.startTime}–${ts.endTime}|"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:selected="${b.id == appointment.branchId}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Кабинет<br>
            <select name="roomId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:selected="${r.id == appointment.roomId}" th:text="${r.name}"></option>
            </select>
        </label></p>
        <p><label>Статус<br>
            <select name="status" required style="width:100%;max-width:32rem">
                <option th:each="st : ${statuses}" th:value="${st.name()}" th:selected="${st == appointment.status}" th:text="${st.name()}"></option>
            </select>
        </label></p>
        <p><label>Источник<br>
            <select name="source" required style="width:100%;max-width:32rem">
                <option th:each="so : ${sources}" th:value="${so.name()}" th:selected="${so == appointment.source}" th:text="${so.name()}"></option>
            </select>
        </label></p>
        <p><label>Заметки<br><textarea name="notes" rows="3" style="width:100%;max-width:32rem" th:text="${appointment.notes != null ? appointment.notes : ''}"></textarea></label></p>
        <p><label>Кто создал (необязательно)<br>
            <select name="createdBy" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:selected="${appointment.createdBy != null and e.id == appointment.createdBy}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/appointments/{id}(id=${appointment.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${appointment != null}">
        (function () {
            const id = /*[[${appointment.id}]]*/ '';
            document.getElementById('edit-f').addEventListener('submit', function (e) {
                e.preventDefault();
                const p = new URLSearchParams(new FormData(e.target));
                fetch('/mvc/appointments/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: p.toString()
                }).then(function (r) {
                    if (r.ok || (r.status >= 300 && r.status < 400)) window.location.href = '/mvc/appointments/' + id;
                    else window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
