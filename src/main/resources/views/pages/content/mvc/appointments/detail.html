<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${appointment != null}">
        <h2 th:text="${appointment.status}">status</h2>
        <p><strong>Пациент:</strong> <span th:text="${patientName}">—</span></p>
        <p><strong>Сотрудник:</strong> <span th:text="${employeeName}">—</span></p>
        <p><strong>Филиал:</strong> <span th:text="${branchName}">—</span></p>
        <p><strong>Кабинет:</strong> <span th:text="${roomName}">—</span></p>
        <p th:if="${slotLabel != null and !#strings.isEmpty(slotLabel)}"><strong>Слот:</strong> <span th:text="${slotLabel}"></span></p>
        <p><strong>Источник:</strong> <span th:text="${appointment.source}">—</span></p>
        <p th:if="${appointment.notes != null}"><strong>Заметки:</strong> <span th:text="${appointment.notes}"></span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/appointments}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/appointments/{id}/edit(id=${appointment.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${appointment.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script th:inline="javascript">
        (function () {
            const b = document.getElementById('mvc-del');
            if (!b) return;
            b.addEventListener('click', function () {
                const id = b.getAttribute('data-id');
                if (!id || !confirm('Удалить?')) return;
                fetch('/mvc/appointments/' + id, { method: 'DELETE' }).then(function () {
                    window.location.href = '/mvc/appointments';
                });
            });
        })();
    </script>
</section>
</body>
</html>
