<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Новая запись</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/appointments}" accept-charset="UTF-8">
        <p><label>Пациент<br>
            <select name="patientId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}"></option>
            </select>
        </label></p>
        <p><label>Сотрудник<br>
            <select name="employeeId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p><label>Слот (необязательно)<br>
            <select name="timeSlotId" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="ts : ${timeSlots}" th:value="${ts.id}" th:text="|${ts.slotDate} ${ts.startTime}–${ts.endTime}|"></option>
            </select>
        </label></p>
        <p><label>Филиал<br>
            <select name="branchId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label>Кабинет<br>
            <select name="roomId" required style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
        </label></p>
        <p><label>Статус<br>
            <select name="status" required style="width:100%;max-width:32rem">
                <option th:each="st : ${statuses}" th:value="${st.name()}" th:text="${st.name()}"></option>
            </select>
        </label></p>
        <p><label>Источник<br>
            <select name="source" required style="width:100%;max-width:32rem">
                <option th:each="so : ${sources}" th:value="${so.name()}" th:text="${so.name()}"></option>
            </select>
        </label></p>
        <p><label>Заметки<br><textarea name="notes" rows="3" style="width:100%;max-width:32rem"></textarea></label></p>
        <p><label>Кто создал (необязательно)<br>
            <select name="createdBy" style="width:100%;max-width:32rem">
                <option value="">—</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
            </select>
        </label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/appointments}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
