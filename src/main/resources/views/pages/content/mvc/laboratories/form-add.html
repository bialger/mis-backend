<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Лаборатория</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/laboratories}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Тип интеграции<br><input name="integrationType" placeholder="строка" style="width:100%;max-width:32rem"></label></p>
        <p><label>Конфиг (JSON)<br><textarea name="config" rows="4" placeholder="{}" style="width:100%;max-width:40rem"></textarea></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" checked> Активна</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/laboratories}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
