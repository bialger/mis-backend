<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Тип тега пациента</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/patient-tag-types}" accept-charset="UTF-8">
        <p><label>Код<br><input name="code" required maxlength="50" style="width:100%;max-width:32rem"></label></p>
        <p><label>Название<br><input name="name" required maxlength="100" style="width:100%;max-width:32rem"></label></p>
        <p><label>Иконка<br><input name="icon" maxlength="10" style="width:100%;max-width:32rem"></label></p>
        <p><label>Описание<br><textarea name="description" rows="3" style="width:100%;max-width:32rem"></textarea></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" checked> Активен</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/patient-tag-types}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
