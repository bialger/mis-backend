<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.name}">name</h2>
        <p th:if="${item.codeOkpo != null}"><strong>ОКПО:</strong> <span th:text="${item.codeOkpo}"></span></p>
        <p th:if="${item.codeOkud != null}"><strong>ОКУД:</strong> <span th:text="${item.codeOkud}"></span></p>
        <p th:if="${item.address != null}" style="white-space: pre-wrap" th:text="${item.address}">addr</p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/organizations}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/organizations/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/organizations/', '/mvc/organizations');
    </script>
</section>
</body>
</html>
