<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Услуга</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" method="post" th:action="@{/mvc/medical-services}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem"></label></p>
        <p><label>Цена<br><input name="price" required placeholder="0.00" style="width:100%;max-width:32rem"></label></p>
        <p><label>Себестоимость<br><input name="costPrice" placeholder="опционально" style="width:100%;max-width:32rem"></label></p>
        <p><label>Филиал (UUID)<br><input name="branchId" placeholder="опционально" style="width:100%;max-width:32rem"></label></p>
        <p><label><input type="checkbox" name="isActive" value="true" checked> Активна</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/medical-services}">Отмена</a>
        </p>
    </form>
</section>
</body>
</html>
