<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование услуги</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="edit-f" th:if="${item != null}" accept-charset="UTF-8">
        <p><label>Название<br><input name="name" required style="width:100%;max-width:32rem" th:value="${item.name}"></label></p>
        <p><label>Цена<br><input name="price" required style="width:100%;max-width:32rem" th:value="${item.price}"></label></p>
        <p><label>Себестоимость<br><input name="costPrice" style="width:100%;max-width:32rem" th:value="${item.costPrice}"></label></p>
        <p><label>Филиал<br>
            <select name="branchId" style="width:100%;max-width:32rem">
                <option value="">— не привязано к филиалу —</option>
                <option th:each="b : ${branches}" th:value="${b.id}"
                        th:selected="${item.branchId != null and item.branchId == b.id}" th:text="${b.name}"></option>
            </select>
        </label></p>
        <p><label><input type="checkbox" name="isActive" value="true" th:checked="${item.isActive}"> Активна</label></p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/mvc/medical-services/{id}(id=${item.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${item != null}">
        (function () {
            const id = /*[[${item.id}]]*/ '';
            mvcPatchSubmit('edit-f', '/mvc/medical-services/' + id);
        })();
    </script>
</section>
</body>
</html>
