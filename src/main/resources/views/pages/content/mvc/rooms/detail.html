<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <div class="m-card" th:if="${item != null}">
        <h2 th:text="${item.name}">name</h2>
        <p th:if="${branchName != null}"><strong>Филиал:</strong> <span th:text="${branchName}"></span></p>
        <p th:if="${item.description != null}" style="white-space: pre-wrap" th:text="${item.description}"></p>
        <p><strong>Активен:</strong> <span th:text="${item.isActive} ? 'да' : 'нет'"></span></p>
        <p>
            <a class="m-tab-button" th:href="@{/mvc/rooms}">К списку</a>
            <a class="m-tab-button" th:href="@{/mvc/rooms/{id}/edit(id=${item.id})}">Редактировать</a>
            <button type="button" class="m-tab-button" th:attr="data-id=${item.id}" id="mvc-del">Удалить</button>
        </p>
    </div>
    <script>
        mvcWireDeleteButton('mvc-del', '/mvc/rooms/', '/mvc/rooms');
    </script>
</section>
</body>
</html>
