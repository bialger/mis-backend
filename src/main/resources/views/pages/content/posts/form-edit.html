<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="m-dashboard" th:fragment="content">
    <h2>Редактирование поста</h2>
    <div th:if="${error != null}" class="m-error-message" th:text="${error}"></div>
    <form class="m-card m-section" id="post-edit-form" th:if="${post != null}" accept-charset="UTF-8">
        <p>
            <label for="title">Заголовок</label><br>
            <input id="title" name="title" type="text" required maxlength="500" style="width:100%;max-width:40rem"
                   th:value="${post.title}">
        </p>
        <p>
            <label for="body">Текст</label><br>
            <textarea id="body" name="body" rows="8" style="width:100%;max-width:40rem" th:text="${post.body}"></textarea>
        </p>
        <p>
            <button type="submit" class="m-tab-button">Сохранить</button>
            <a class="m-tab-button" th:href="@{/posts/{id}(id=${post.id})}">Отмена</a>
        </p>
    </form>
    <script th:inline="javascript" th:if="${post != null}">
        (function () {
            const form = document.getElementById('post-edit-form');
            const postId = /*[[${post.id}]]*/ 0;
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const params = new URLSearchParams(new FormData(form));
                fetch('/posts/' + postId, {
                    method: 'PATCH',
                    redirect: 'manual',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                }).then(function (r) {
                    var detailUrl = '/posts/' + postId;
                    var loc = r.headers.get('Location');
                    if (r.status >= 300 && r.status < 400) {
                        window.location.href = loc ? new URL(loc, window.location.origin).href : detailUrl;
                        return;
                    }
                    window.location.reload();
                }).catch(function () {
                    window.location.reload();
                });
            });
        })();
    </script>
</section>
</body>
</html>
