<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <th:block th:utext="${frontendSectionHtml}"></th:block>
    <script type="application/json" id="crm-shell-bootstrap" th:if="${crmPageJson != null}" th:utext="${crmPageJson}"></script>
    <script th:if="${crmPageJson != null}">
        (function () {
            function normPage(p) {
                if (p != null && typeof p === 'object' && !Array.isArray(p)) return p;
                return {};
            }
            var el = document.getElementById('crm-shell-bootstrap');
            if (el && el.textContent) {
                try {
                    var raw = JSON.parse(el.textContent);
                    window.__CRM_PAGE__ = (window.CrmApi && window.CrmApi.normalizePage)
                        ? window.CrmApi.normalizePage(raw)
                        : normPage(raw);
                } catch (e) { console.error(e); window.__CRM_PAGE__ = {}; }
            }
        })();
    </script>
    <th:block th:if="${sseEventsPath != null}" th:replace="~{fragments/mvc-sse :: client}"></th:block>
</th:block>
</body>
</html>
