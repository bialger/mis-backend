<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="l-footer" th:fragment="appFooter(currentYear)">
    <div class="l-footer-container">
        <div class="l-footer-info">
            <h3>Системная информация</h3>
            <address>
                <p>Версия системы: <strong>1.0.0</strong></p>
                <p>Последнее обновление: <strong>02.03.2026</strong></p>
                <p>Техническая поддержка: <strong>support@medcrm.local</strong></p>
                <p>Статус системы: <strong>Активна</strong></p>
            </address>
        </div>
        <div class="l-footer-copyright">
            <p>&copy; <span th:text="${currentYear}">2026</span> Bialger. Все права защищены.</p>
        </div>
    </div>
    <div class="l-footer-timing-wrap">
        <p class="l-footer-timing" id="footer-timing" aria-live="polite"></p>
    </div>
    <script>
        (function () {
            /* After load: server ms is set by injected script at end of document; nav timing needs load. */
            function updateFooterTiming() {
                var serverMs = (typeof window.__serverElapsedMs === 'number') ? window.__serverElapsedMs : null;
                var clientMs = null;
                var navEntry = performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
                if (navEntry && navEntry.duration > 0) {
                    clientMs = Math.round(navEntry.duration);
                } else if (performance.timing && performance.timing.loadEventEnd > 0 && performance.timing.navigationStart > 0) {
                    clientMs = Math.round(performance.timing.loadEventEnd - performance.timing.navigationStart);
                } else {
                    clientMs = Math.round(performance.now());
                }
                var el = document.getElementById('footer-timing');
                if (!el) return;
                var parts = [];
                if (serverMs !== null) parts.push('ответ сервера ' + serverMs + ' мс');
                parts.push('полная загрузка в браузере ' + clientMs + ' мс');
                el.textContent = parts.join(' · ');
            }
            if (document.readyState === 'complete') {
                updateFooterTiming();
            } else {
                window.addEventListener('load', updateFooterTiming);
            }
        })();
    </script>
</footer>
</body>
</html>
