<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="l-footer" th:fragment="appFooter(currentYear)">
    <div class="l-footer-container">
        <div class="l-footer-info">
            <h3>Системная информация</h3>
            <address>
                <p>Версия системы: <strong>1.0.0</strong></p>
                <p>Последнее обновление: <strong>02.03.2026</strong></p>
                <p>Техническая поддержка: <strong>support@medcrm.local</strong></p>
                <p>Статус системы: <strong>Активна</strong></p>
            </address>
        </div>
        <div class="l-footer-timing" id="footer-timing" style="font-size:0.8rem;color:#888;padding:0.25rem 1rem;">
            <!-- populated by timing script below -->
        </div>
        <div class="l-footer-copyright">
            <p>&copy; <span th:text="${currentYear}">2026</span> Bialger. Все права защищены.</p>
        </div>
    </div>
    <script>
        (function () {
            var serverMs = (typeof window.__serverElapsedMs !== 'undefined') ? window.__serverElapsedMs : null;
            var navEntry = performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
            var clientMs = navEntry ? Math.round(navEntry.duration) : Math.round(performance.now());
            var el = document.getElementById('footer-timing');
            if (el) {
                var parts = [];
                if (serverMs !== null) parts.push('Сервер: ' + serverMs + ' мс');
                parts.push('Клиент: ' + clientMs + ' мс');
                el.textContent = 'Время загрузки — ' + parts.join(' | ');
            }
        })();
    </script>
</footer>
</body>
</html>
