# Random free port per test context (parallel Kotest + local dev server avoids BindException on 18080)
micronaut.server.port=-1
# Yandex Object Storage stubs for tests — real calls are prevented by @MockBean
yc.key=test-key
yc.secret=test-secret
yc.bucket=test-bucket
# Local: 1432 (docker). CI: 5432 (GitHub Actions services) — override via MICRONAUT_DATASOURCES_DEFAULT_URL
datasources.default.url=${MICRONAUT_DATASOURCES_DEFAULT_URL:`jdbc:postgresql://localhost:1432/mis`}
datasources.default.username=${MICRONAUT_DATASOURCES_DEFAULT_USERNAME:mis}
datasources.default.password=${MICRONAUT_DATASOURCES_DEFAULT_PASSWORD:mis}
test.auto-auth.enabled=true
# Same value must be used in CI (workflow job env), Gradle Test systemProperty/environment, and @MicronautTest @Property where tests pin JWT.
JWT_SECRET=test-jwt-secret-for-integration-tests-only-1234567890
JWT_COOKIE_SECURE=false
