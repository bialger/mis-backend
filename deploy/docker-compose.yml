# Разворачивается на сервере через CI (SCP + docker compose).
# Образ подставляется из переменной MIS_IMAGE при деплое.

services:
  app:
    image: ${MIS_IMAGE}
    container_name: mis
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      - MICRONAUT_SERVER_HOST=0.0.0.0
      - MICRONAUT_SERVER_PORT=8000
