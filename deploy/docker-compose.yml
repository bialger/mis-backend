services:
  app:
    image: ${MIS_IMAGE}
    container_name: mis
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MICRONAUT_SERVER_HOST=0.0.0.0
      - MICRONAUT_SERVER_PORT=8000
      - MICRONAUT_DATASOURCES_DEFAULT_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - MICRONAUT_DATASOURCES_DEFAULT_USERNAME=${POSTGRES_USER}
      - MICRONAUT_DATASOURCES_DEFAULT_PASSWORD=${POSTGRES_PASSWORD}
      - YC_KEY=${YC_KEY}
      - YC_SECRET=${YC_SECRET}
      - YC_BUCKET=${YC_BUCKET}

  postgres:
    image: postgres:17
    container_name: mis-postgres
    restart: unless-stopped
    ports:
      - "1432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
